name: Publish Saminaras Inspector 0.6.4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-saminaras-0.6.4.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o artifact.zip 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-1bdc-8210-b902-2a4326c4f6e8/raw?se=2026-10-01T11%3A25%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=8de2c286-8331-5353-886c-94025739c95a&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T06%3A22%3A59Z&ske=2026-10-02T06%3A22%3A59Z&sks=b&skv=2026-02-06&sig=LD0kgK5kgjZ1etTBEhEfIq3OgBpHMqJkaa00LFQzKBA%3D'
          unzip -o artifact.zip -d artifact
          test -f artifact/SHA256SUMS.txt
          (cd artifact && sha256sum -c SHA256SUMS.txt)
          APK="$(find artifact -type f -name 'saminaras-inspector-0.6.4.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" saminaras-inspector-0.6.4.apk
          cp "$APK" saminaras-inspector.apk
          sha256sum saminaras-inspector-0.6.4.apk saminaras-inspector.apk

      - name: Publish public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="codebazcom/codebazcom"
          if gh release view v0.6.4 --repo "$REPO" >/dev/null 2>&1; then
            gh release upload v0.6.4 saminaras-inspector-0.6.4.apk saminaras-inspector.apk --repo "$REPO" --clobber
          else
            gh release create v0.6.4               saminaras-inspector-0.6.4.apk               saminaras-inspector.apk               --repo "$REPO"               --target main               --title "Saminaras Inspector Android v0.6.4"               --notes "رفع مشکل نتیجه نامشخص در ارسال عکس و ZIP، بازیابی خودکار رسید بسته روی سرور، ادامه امن ارسال روی اینترنت کند، و بهبود پایداری صف ارسال."
          fi
