name: Publish Inspector Android v0.6.6 public mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-inspector-066.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified 0.6.6 artifact
        env:
          ARTIFACT_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-cecc-820a-a921-5a919353c361/raw?se=2026-10-02T16%3A31%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=bab71f2e-3e11-5de1-8399-7cec568fa0c0&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T05%3A33%3A40Z&ske=2026-10-03T05%3A33%3A40Z&sks=b&skv=2026-02-06&sig=cfCSBH%2BwlKFuXJlmLxW4i9mOPcJ44eljKSqxxHeoxYw%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o "$RUNNER_TEMP/inspector-0.6.6.zip"
          mkdir -p release
          unzip -q "$RUNNER_TEMP/inspector-0.6.6.zip" -d release
          cd release
          sha256sum -c SHA256SUMS.txt
          grep -Fx '8655755aa8663c62b581bdf9196c8aa654cd3bb7' SOURCE_COMMIT.txt
          cp saminaras-inspector-0.6.6.apk saminaras-inspector.apk

      - name: Publish public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v0.6.6 --repo codebazcom/codebazcom >/dev/null 2>&1; then
            gh release upload v0.6.6 release/saminaras-inspector-0.6.6.apk release/saminaras-inspector.apk release/SHA256SUMS.txt release/SOURCE_COMMIT.txt --repo codebazcom/codebazcom --clobber
          else
            gh release create v0.6.6 \
              release/saminaras-inspector-0.6.6.apk release/saminaras-inspector.apk release/SHA256SUMS.txt release/SOURCE_COMMIT.txt \
              --repo codebazcom/codebazcom --target main \
              --title "Saminaras Inspector Android v0.6.6" \
              --notes "ارسال پس‌زمینه با اعلان پیشرفت و توقف/ادامه؛ حفظ صف ارسال و فایل‌های ارسال‌نشده هنگام خروج و ارتقا."
          fi
