name: Verify public Inspector Android 0.6.5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-inspector-065-public.yml

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify anonymous versioned and latest APK downloads
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --retry 3 --max-time 120 --proto '=https' --write-out 'versioned_http=%{http_code} bytes=%{size_download}\n' 'https://github.com/codebazcom/codebazcom/releases/download/v0.6.5/saminaras-inspector-0.6.5.apk' -o versioned.apk
          printf '%s\n' '9c582735b4c95c290de4395aafdb4b6edab897c6a5f8530d9b4e1b1b69128b10  versioned.apk' | sha256sum -c -
          curl --fail --location --silent --show-error --retry 3 --max-time 120 --proto '=https' --write-out 'latest_http=%{http_code} bytes=%{size_download}\n' 'https://github.com/codebazcom/codebazcom/releases/latest/download/saminaras-inspector.apk' -o latest.apk
          printf '%s\n' '9c582735b4c95c290de4395aafdb4b6edab897c6a5f8530d9b4e1b1b69128b10  latest.apk' | sha256sum -c -
          cmp versioned.apk latest.apk
          test "$(stat -c '%s' versioned.apk)" = 82554772
          echo 'Both APK links work without authentication and match the original verified 0.6.5 build.'
