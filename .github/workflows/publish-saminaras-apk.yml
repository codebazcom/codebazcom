name: Publish Saminaras Inspector APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-saminaras-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3 -o artifact.zip 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-9d44-820a-95da-637a33dc78f6/raw?se=2026-09-29T19%3A11%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=9d4a85a4-6c4a-535b-944f-086a7c261728&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T09%3A51%3A21Z&ske=2026-09-30T09%3A51%3A21Z&sks=b&skv=2026-02-06&sig=mwqs%2Bvef%2B5gjTMtPm4JyUvDap%2BtchyMvz%2BjQXdcL9ig%3D'
          unzip -o artifact.zip -d artifact
          find artifact -maxdepth 3 -type f -print

      - name: Prepare stable and versioned APK names
        shell: bash
        run: |
          APK="$(find artifact -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" saminaras-inspector-0.6.1.apk
          cp "$APK" saminaras-inspector.apk

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view v0.6.1 >/dev/null 2>&1; then
            gh release upload v0.6.1 saminaras-inspector-0.6.1.apk saminaras-inspector.apk --clobber
          else
            gh release create v0.6.1 saminaras-inspector-0.6.1.apk saminaras-inspector.apk               --title "Saminaras Inspector Android v0.6.1"               --notes "Public APK download for Saminaras Inspector Android."
          fi
