name: Publish Saminaras Inspector APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-saminaras-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        shell: bash
        run: |
          curl -L --fail --retry 3 -o artifact.zip 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-5950-81f4-b0f2-45f059c6a672/raw?se=2026-09-29T19%3A12%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=360cc878-c69c-5511-8eac-b375164770b9&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T03%3A55%3A50Z&ske=2026-09-30T03%3A55%3A50Z&sks=b&skv=2026-02-06&sig=3NjGQv1iLwv34TSW01SwEmGXAyYz0Yyk0%2Bzav5lh4w0%3D'
          unzip -o artifact.zip -d artifact
          find artifact -maxdepth 3 -type f -print

      - name: Prepare stable and versioned APK names
        shell: bash
        run: |
          APK="$(find artifact -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" saminaras-inspector-0.6.1.apk
          cp "$APK" saminaras-inspector.apk

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REPO="codebazcom/codebazcom"
          if gh release view v0.6.1 --repo "$REPO" >/dev/null 2>&1; then
            gh release upload v0.6.1 saminaras-inspector-0.6.1.apk saminaras-inspector.apk --repo "$REPO" --clobber
          else
            gh release create v0.6.1 saminaras-inspector-0.6.1.apk saminaras-inspector.apk               --repo "$REPO"               --target main               --title "Saminaras Inspector Android v0.6.1"               --notes "Public APK download for Saminaras Inspector Android."
          fi
